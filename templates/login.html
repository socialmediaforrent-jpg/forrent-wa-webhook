<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Iniciar sesión · For Rent Online</title>
{% include '_head_icons.html' %}
{% include '_brand.css.html' %}
</head>
<body class="login-body">
<main class="login-wrap">
  <div class="login-card">
    <a class="brand" href="/login" aria-label="For Rent Online">
      <picture>
        <source srcset="{{ static_v('logo.webp') }} 1x, {{ static_v('logo-1200.webp') }} 2x" type="image/webp">
        <img class="logo login-logo" src="{{ static_v('logo.png') }}" alt="For Rent Online" width="800" height="302">
      </picture>
    </a>
    <h1 class="page">¡Bienvenido a For Rent Online!</h1>
    <p class="lead">Ingresa con tu usuario y contraseña.</p>
    {% if error %}
    <div class="alert err" role="alert">{{ error }}</div>
    {% endif %}
    <form class="login-form" method="post" action="/login" autocomplete="on">
      {% if next_url %}<input type="hidden" name="next" value="{{ next_url }}">{% endif %}
      <label>Usuario
        <input type="text" name="usuario" value="{{ usuario }}" required autofocus autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="username">
      </label>
      <label>Contraseña
        <input type="password" name="password" required autocomplete="current-password">
      </label>
      <button type="submit">Iniciar sesión</button>
    </form>
  </div>
</main>
</body>
</html>
