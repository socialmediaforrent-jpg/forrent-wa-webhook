<div class="top">
  <div class="row">
    <a class="brand" href="/portal">For Rent <span>Portal</span></a>
    <div class="sub">{{ subtitle }}{% if viewer %} · {{ viewer.name }}{% endif %}</div>
  </div>
  {% if nav_links %}
  <nav class="bar" aria-label="Secciones">
    {% for href, label, key in nav_links %}
    <a href="{{ href }}" class="{{ 'on' if nav==key else '' }}">{{ label }}</a>
    {% endfor %}
  </nav>
  {% endif %}
</div>
