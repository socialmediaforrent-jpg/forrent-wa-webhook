<style>
:root{--naranja:#E76108;--negro:#111;--fondo:#f4f4f5;--texto:#111;--muted:#5b6475;--linea:#e3e7ef;--in:#fff;--out:#fff3ea;--out-borde:#f0c9a8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--texto);
  font-family:Inter,"Helvetica Neue",Arial,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{min-height:100%}
.top{background:#fff;border-bottom:4px solid var(--naranja);padding:10px 16px}
.top .row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;font-size:20px;letter-spacing:.2px;color:var(--negro);text-decoration:none}
.brand span{color:var(--naranja)}
.sub{color:var(--muted);font-size:13px}
nav.bar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
nav.bar a{color:var(--negro);text-decoration:none;font-size:13px;font-weight:700;
  padding:6px 10px;border-radius:8px;background:#f4f4f5}
nav.bar a.on,nav.bar a:hover{background:#fff3ea;color:#9a3d04}
.note{background:#fff8f3;border:1px solid #f0c9a8;color:#7a3d04;padding:8px 16px;font-size:13px;line-height:1.45}
.wrap-page{max-width:980px;margin:0 auto;padding:16px}
h1.page{font-size:22px;margin:8px 0 4px}
.lead{color:var(--muted);margin:0 0 16px;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{display:block;background:#fff;border-radius:14px;padding:16px 16px 14px;
  text-decoration:none;color:inherit;border-left:5px solid var(--naranja);
  box-shadow:0 2px 8px rgba(0,0,0,.07);min-height:132px}
.card:hover{outline:2px solid var(--naranja)}
.card h2{margin:0 0 6px;font-size:18px}
.card p{margin:0;color:#444;font-size:14px;line-height:1.4}
.card .go{margin-top:12px;color:var(--naranja);font-weight:800;font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.tabs button{border:0;background:#fff;color:#111;font:inherit;font-weight:700;font-size:13px;
  padding:8px 12px;border-radius:9px;cursor:pointer}
.tabs button.on{background:var(--naranja);color:#fff}
.search{width:100%;font:inherit;padding:10px 12px;border:1px solid #cdd4e0;border-radius:9px;margin:0 0 12px}
.search:focus{outline:2px solid var(--naranja);border-color:var(--naranja)}
table.inv{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;font-size:14px}
table.inv th{background:#111;color:#fff;text-align:left;font-weight:700;padding:8px 10px;font-size:12px}
table.inv td{padding:8px 10px;border-bottom:1px solid var(--linea);vertical-align:top}
table.inv tr:hover{background:#fff8f3}
.badge{display:inline-block;background:#fff3ea;color:#9a3d04;border-radius:5px;padding:1px 6px;font-size:11px;font-weight:700;margin-left:4px}
.op{display:inline-block;background:#111;color:#fff;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700}
.op.alq{background:#0a6cff}
.muted{color:var(--muted);font-size:13px}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.group{display:none}
.group.on{display:block}
@media (max-width:720px){
  table.inv,table.inv thead,table.inv tbody,table.inv th,table.inv td,table.inv tr{display:block}
  table.inv thead{display:none}
  table.inv tr{border-bottom:8px solid var(--fondo);padding:10px 12px}
  table.inv td{border:0;padding:2px 0}
  table.inv td::before{content:attr(data-label);display:block;font-size:11px;color:var(--muted);font-weight:700}
}
</style>
