databases:
  - name: forrent-wa-db
    # Igual al plan real en Render (basic 256 MB, de pago desde 15-nov-2026). Con «free» aquí, una sincronización
    # del Blueprint intentaría bajar el plan.
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "17"
    databaseName: forrent_wa_db
    user: forrent_wa_db_user
    ipAllowList: []

services:
  - type: web
    name: forrent-wa-webhook
    runtime: python
    # Igual al plan real (Starter 0.5 CPU / 512 MB). Con «free» una sincronización del Blueprint lo bajaría.
    plan: starter
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: forrent-wa-db
          property: connectionString
      - key: WA_VERIFY_TOKEN_SHA256
        sync: false
      - key: WA_READ_KEY_SHA256
        sync: false
      - key: PANEL_PASSWORD_SHA256
        sync: false
      - key: PANEL_USERNAME
        value: pintojosedaniel
      - key: PORTAL_ESTATUS_URL
        sync: false
      - key: PORTAL_CIERRES_URL
        sync: false
      - key: PORTAL_ASESORES_SHA256
        sync: false
      # Llave de Inventario SOLO para /admin/portal-links (importar/exportar enlaces). En Render va el SHA-256.
      # Sin esta variable, Inventario no puede usar esas rutas (la caja sí, con PORTAL_SYNC_KEY).
      - key: INVENTARIO_LINKS_KEY_SHA256
        sync: false
      - key: SECRET_KEY
        generateValue: true
        sync: false
      - key: GRAPH_VERSION
        value: v27.0
      # OJO: el Blueprint (autoSync) reescribe estos dos valores en cada sincronización. Si se activa la respuesta
      # automática en el panel de Render, cambiar también aquí o la próxima sincronización la apaga.
      - key: AUTO_REPLY_ENABLED
        value: "0"
