databases:
  - name: forrent-wa-db
    plan: free
    region: oregon
    postgresMajorVersion: "17"
    databaseName: forrent_wa_db
    user: forrent_wa_db_user
    ipAllowList: []

services:
  - type: web
    name: forrent-wa-webhook
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: forrent-wa-db
          property: connectionString
      - key: WA_VERIFY_TOKEN_SHA256
        sync: false
      - key: WA_READ_KEY_SHA256
        sync: false
      - key: PANEL_PASSWORD_SHA256
        sync: false
      - key: PORTAL_ESTATUS_URL
        sync: false
      - key: PORTAL_CIERRES_URL
        sync: false
      - key: PORTAL_ASESORES_SHA256
        sync: false
      - key: GRAPH_VERSION
        value: v27.0
      - key: AUTO_REPLY_ENABLED
        value: "0"
